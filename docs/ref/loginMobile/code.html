        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24;

<body class="bg-surface-ivory min-h-screen flex flex-col font-body-md text-on-surface antialiased overflow-x-hidden">
<!-- Top Section: Visual Photography Split -->
<header class="relative w-full h-[40vh] min-h-[300px] bg-primary overflow-hidden">
<img alt="Ballerina photography" class="w-full h-full object-cover opacity-50 grayscale mix-blend-overlay" src="https://lh3.googleusercontent.com/aida/AP1WRLuUjweg5psrdrVUAG3OuUGmevfueult3wyALOLaBZZu-h-zDlnv5UzN8NaMZOo69zVT7WLY8Vw02sfI9a_195rq_uoWFyctWFOeZF4-mnb5uQBBZXLXPSeyNR1dY5X24C6j4Ynat4IICXq3CeHPri8sCAiFy1LcXAVwJg57uo90TZHM2HifwjaFOdzD5_-iSHpMCk1BaPdWJYW-cQ8QZlahxo0mqAmcwLQqHShMiFDv9cSsIhiLGo2Jo0DC"/>
<!-- Logo Overlay -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-white p-4 shadow-xl">
<img alt="AUB Logo" class="w-24 h-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBiivbaRYkD-3T3tC10MZUkZnPMKmKmNhGXCTAn6-wamd_HAIOQjtMuCV0PXCTqpAB5xXuhisiv-Cmr_4uePm_ziaY0M9fTVBJxza-_Q5vt2uMgaPXjKds4OS58G25Bh9iLWfVAfw9-VSjriiQonP87jR1GPmBzcp6EN9fymun2jG_Xx1hnolylS2bwu8C7epWo4AL0nlpBNXum35Ar2-KNWvn55b4kIau3FS1i1oG2ICjc_p4qdsHJOZBzZcNPZfADIU"/>
</div>
</div>
</header>
<!-- Bottom Section: Login Form Container -->
<main class="flex-grow flex flex-col bg-surface-ivory px-6 py-10">
<div class="w-full max-w-md mx-auto">
<!-- Heading -->
<div class="mb-8 text-center sm:text-left">
<h1 class="font-headline-md text-primary uppercase mb-2 tracking-wide">
                    Accedi al Portale
                </h1>
<p class="font-body-sm text-on-surface-variant">
                    Inserisci le tue credenziali per accedere alla gestione dell'Accademia.
                </p>
</div>
<!-- Form -->
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-caps text-on-surface-variant uppercase" for="email">
                        Email
                    </label>
<div class="relative">
<input class="w-full bg-white border border-border-subtle rounded-none py-4 px-4 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200" id="email" name="email" placeholder="nome.cognome@accademia.it" required="" type="email"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-on-surface-variant uppercase" for="password">
                            Password
                        </label>
</div>
<div class="relative">
<input class="w-full bg-white border border-border-subtle rounded-none py-4 px-4 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" id="togglePassword" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary py-5 px-6 font-headline-sm uppercase tracking-[0.2em] hover:bg-primary-container transition-colors duration-300 active:scale-[0.98] flex items-center justify-center gap-2 group" type="submit">
                        ACCEDI
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-12 pt-8 border-t border-border-subtle text-center space-y-4">
<a class="block font-body-sm text-primary hover:underline underline-offset-4" href="#">
                    Password dimenticata?
                </a>
<div class="pt-2">
<span class="font-body-sm text-on-surface-variant">Problemi di accesso?</span>
<a class="block font-body-sm text-primary font-medium mt-1 hover:underline underline-offset-4" href="#">
                        Contatta la Segreteria Didattica
                    </a>
</div>
</div>
</div>
</main>
<!-- Page Footer -->
<footer class="py-8 px-6 text-center bg-surface-ivory border-t border-border-subtle/30">
<p class="font-label-caps text-[10px] text-outline tracking-widest uppercase opacity-60">
            © 2024 Accademia Ucraina di Balletto • Academy Administration System
        </p>
</footer>
<script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
